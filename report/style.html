<style>
@page { size: A4; margin: 15mm 15mm 15mm 15mm; }
body { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 9.6pt; line-height: 1.36; color: #111; max-width: none; margin: 0; padding: 0; }
header#title-block-header { margin-bottom: 4px; }
h1.title { font-size: 17pt; margin: 0 0 2px; }
p.subtitle { font-size: 10.5pt; margin: 0 0 6px; color: #444; }
h1 { font-size: 12.5pt; margin: 12px 0 4px; border-bottom: 1px solid #999; padding-bottom: 2px; }
p { margin: 4px 0; }
table { border-collapse: collapse; width: 100%; font-size: 8.2pt; margin: 5px 0; page-break-inside: avoid; }
th, td { border: 1px solid #bbb; padding: 2px 4px; vertical-align: top; text-align: left; }
th { background: #eee; }
code { font-size: 8.4pt; background: #f3f3f3; padding: 0 2px; }
pre.mermaid { background: none; text-align: center; margin: 4px 0; page-break-inside: avoid; }
pre.mermaid svg { max-height: 300px; max-width: 100%; }
ol, ul { margin: 3px 0; padding-left: 20px; }
li { margin: 1px 0; }
</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('pre.mermaid').forEach(p => { p.textContent = p.textContent; });
  mermaid.initialize({ startOnLoad: false, theme: 'neutral', flowchart: { useMaxWidth: true }, sequence: { useMaxWidth: true } });
  mermaid.run({ querySelector: 'pre.mermaid' });
});
</script>
